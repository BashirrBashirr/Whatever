<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAIN · 3D atlas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #040607;
      --text: #f0f4f8;
      --dim: #5a6b7c;
      --accent: #4ae3c0;
    }
    body {
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }

    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      pointer-events: none;
    }
    .brand {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      pointer-events: auto;
    }
    .brand .dot {
      width: 5px; height: 5px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2.4s infinite ease-in-out;
    }
    .hint {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
      pointer-events: auto;
    }

    .info-overlay {
      position: fixed;
      bottom: 2rem; left: 2rem;
      z-index: 10;
      max-width: 340px;
      pointer-events: none;
    }
    .info-card {
      background: rgba(5, 8, 12, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 1rem;
      padding: 1.4rem 1.6rem;
      pointer-events: auto;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s, transform 0.35s;
      box-shadow: 0 20px 40px -20px #000;
      position: relative;
    }
    .info-overlay.visible .info-card {
      opacity: 1;
      transform: translateY(0);
    }
    .region-name {
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 0.15rem;
    }
    .region-latin {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--accent);
      margin-bottom: 0.9rem;
      font-weight: 400;
    }
    .region-desc {
      font-size: 0.82rem;
      color: #a0b4c8;
      line-height: 1.65;
      margin-bottom: 1rem;
    }
    .region-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--dim);
      padding-top: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .region-meta .dot {
      width: 4px; height: 4px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }
    .close-btn {
      position: absolute;
      top: 0.8rem; right: 0.8rem;
      width: 24px; height: 24px;
      border: none;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
      font-size: 0.85rem;
      line-height: 1;
      pointer-events: auto;
    }
    .close-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: opacity 0.6s;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }
    .loader .ring {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loader .load-text {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--dim);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }

    @media (max-width: 700px) {
      .top-bar { padding: 1rem 1.2rem; }
      .info-overlay { bottom: 1rem; left: 1rem; right: 1rem; max-width: none; }
      .info-card { padding: 1.2rem; }
      .region-name { font-size: 1.1rem; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="ring"></div>
    <div class="load-text">loading anatomy</div>
  </div>

  <div id="canvas-container"></div>

  <div class="top-bar">
    <div class="brand">
      <span class="dot"></span>
      Brain · 3D Atlas
    </div>
    <div class="hint">drag to rotate · click a region</div>
  </div>

  <div class="info-overlay" id="infoOverlay">
    <div class="info-card" id="infoCard">
      <button class="close-btn" id="closeBtn" aria-label="close">✕</button>
      <div class="region-name" id="regionName">—</div>
      <div class="region-latin" id="regionLatin">—</div>
      <div class="region-desc" id="regionDesc">—</div>
      <div class="region-meta">
        <span class="dot"></span>
        <span>cortical region</span>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ============================================================
    //  ANATOMICALLY REFINED REGION DEFINITIONS
    //  Orientation of the normalized brain model:
    //    +Z = anterior (frontal pole)
    //    -Z = posterior (occipital pole)
    //    +Y = superior (vertex)
    //    -Y = inferior (base)
    //    +X = right hemisphere lateral
    //
    //  Directions are unit vectors pointing at the anatomical
    //  center of each structure. Radii are the angular extent of
    //  the region on the brain surface (radians). Bilateral
    //  structures are mirrored across the X-axis.
    //
    //  Landmark sulci used for placement:
    //   • Central sulcus: ~35° behind +Z, separating frontal/parietal
    //   • Lateral sulcus (Sylvian): ~35° below equator, side
    //   • Parieto-occipital sulcus: ~70° behind +Y, top-back
    //   • Calcarine sulcus: medial occipital (visual cortex)
    // ============================================================
    const REGIONS = {
      // ---------------- CORTICAL LOBES ----------------
      frontal: {
        name: 'Frontal Lobe',
        latin: 'Lobus frontalis',
        desc: 'Anterior to the central sulcus. Contains the primary motor cortex (precentral gyrus), premotor area, prefrontal cortex, and Broca\'s speech area. Responsible for executive function, planning, voluntary movement, and personality.',
        color: new THREE.Color(0x4a9eff),
        dir: new THREE.Vector3(0.15, 0.35, 0.92).normalize(),
        angularRadius: 0.72,
        bilateral: true,
        order: 0,
      },
      parietal: {
        name: 'Parietal Lobe',
        latin: 'Lobus parietalis',
        desc: 'Between the central sulcus anteriorly and the parieto-occipital sulcus posteriorly. Contains the primary somatosensory cortex (postcentral gyrus), and the superior/inferior parietal lobules for spatial attention and navigation.',
        color: new THREE.Color(0x4ae3c0),
        dir: new THREE.Vector3(0.2, 0.92, -0.35).normalize(),
        angularRadius: 0.6,
        bilateral: true,
        order: 1,
      },
      temporal: {
        name: 'Temporal Lobe',
        latin: 'Lobus temporalis',
        desc: 'Inferior to the lateral (Sylvian) sulcus. Contains primary auditory cortex (Heschl\'s gyrus), Wernicke\'s area, and medial structures like the hippocampus and amygdala. Critical for hearing, language, and memory.',
        color: new THREE.Color(0xffa64a),
        dir: new THREE.Vector3(0.95, -0.28, 0.05).normalize(),
        angularRadius: 0.52,
        bilateral: true,
        order: 2,
      },
      occipital: {
        name: 'Occipital Lobe',
        latin: 'Lobus occipitalis',
        desc: 'Posterior to the parieto-occipital sulcus. Contains the primary visual cortex (V1) along the calcarine sulcus, plus visual association areas V2–V5. Dedicated to processing visual information.',
        color: new THREE.Color(0xa45aff),
        dir: new THREE.Vector3(0.1, 0.25, -0.96).normalize(),
        angularRadius: 0.5,
        bilateral: true,
        order: 3,
      },
      insula: {
        name: 'Insula',
        latin: 'Insula',
        desc: 'Hidden within the lateral sulcus, covered by the operculum. Involved in interoception (awareness of internal body state), taste, emotion, and autonomic control. Often called the "fifth lobe".',
        color: new THREE.Color(0xff6b6b),
        dir: new THREE.Vector3(0.78, 0.08, 0.28).normalize(),
        angularRadius: 0.24,
        bilateral: true,
        order: 4,
      },
      cingulate: {
        name: 'Cingulate Cortex',
        latin: 'Cortex cingularis',
        desc: 'Arch-shaped medial cortex above the corpus callosum. Anterior cingulate handles error detection and emotion; posterior cingulate is part of the default mode network. Key limbic component.',
        color: new THREE.Color(0xffe66d),
        dir: new THREE.Vector3(0.12, 0.78, 0.28).normalize(),
        angularRadius: 0.26,
        bilateral: false,   // represented as the medial arch
        order: 5,
      },
      // ---------------- MIDLINE / COMMISSURAL ----------------
      corpusCallosum: {
        name: 'Corpus Callosum',
        latin: 'Corpus callosum',
        desc: 'Massive C-shaped white-matter commissure of ~200 million axons connecting the two hemispheres. Enables interhemispheric transfer of motor, sensory, and cognitive information. Visible only in a midsagittal section.',
        color: new THREE.Color(0xe8e8e8),
        dir: new THREE.Vector3(0, 0.55, 0.1).normalize(),
        angularRadius: 0.3,
        bilateral: false,
        order: 6,
      },
      // ---------------- DIENCEPHALON ----------------
      thalamus: {
        name: 'Thalamus',
        latin: 'Thalamus',
        desc: 'Bilateral egg-shaped gray matter at the center of the diencephalon. Acts as the brain\'s sensory relay station — all sensory modalities except smell pass through before reaching the cortex. Also involved in motor and limbic circuits.',
        color: new THREE.Color(0xff9ff3),
        dir: new THREE.Vector3(0.22, 0.28, -0.15).normalize(),
        angularRadius: 0.24,
        bilateral: true,
        order: 7,
      },
      hypothalamus: {
        name: 'Hypothalamus',
        latin: 'Hypothalamus',
        desc: 'Below the thalamus, forming the floor of the third ventricle. Regulates the autonomic nervous system, body temperature, hunger, thirst, sleep-wake cycles, and controls the pituitary gland via the hypothalamic-pituitary axis.',
        color: new THREE.Color(0xfeca57),
        dir: new THREE.Vector3(0, -0.05, 0.3).normalize(),
        angularRadius: 0.18,
        bilateral: false,
        order: 8,
      },
      pineal: {
        name: 'Pineal Gland',
        latin: 'Glandula pinealis',
        desc: 'Small pine-cone-shaped endocrine gland at the posterior epithalamus, above the midbrain. Secretes melatonin to regulate the circadian rhythm and sleep-wake cycle. Part of the epithalamus.',
        color: new THREE.Color(0xc8d6e5),
        dir: new THREE.Vector3(0, 0.18, -0.6).normalize(),
        angularRadius: 0.13,
        bilateral: false,
        order: 9,
      },
      pituitary: {
        name: 'Pituitary Gland',
        latin: 'Hypophysis',
        desc: 'Pea-sized "master gland" in the sella turcica, connected to the hypothalamus by the infundibulum. Secretes hormones controlling growth, metabolism, reproduction, and the other endocrine glands.',
        color: new THREE.Color(0xf368e0),
        dir: new THREE.Vector3(0, -0.55, 0.28).normalize(),
        angularRadius: 0.13,
        bilateral: false,
        order: 10,
      },
      // ---------------- BASAL GANGLIA ----------------
      basalGanglia: {
        name: 'Basal Ganglia',
        latin: 'Nuclei basales',
        desc: 'Deep gray-matter nuclei (striatum, globus pallidus, substantia nigra, subthalamic nucleus). Central to motor control, action selection, procedural learning, and reward. Dysfunction causes Parkinson\'s and Huntington\'s.',
        color: new THREE.Color(0x48dbfb),
        dir: new THREE.Vector3(0.4, 0.28, 0.15).normalize(),
        angularRadius: 0.24,
        bilateral: true,
        order: 11,
      },
      // ---------------- LIMBIC ----------------
      hippocampus: {
        name: 'Hippocampus',
        latin: 'Hippocampus',
        desc: 'Curved, seahorse-shaped structure in the medial temporal lobe. Essential for consolidation of short-term to long-term memory and for spatial navigation. One of the first regions affected in Alzheimer\'s disease.',
        color: new THREE.Color(0x1dd1a1),
        dir: new THREE.Vector3(0.65, -0.35, -0.28).normalize(),
        angularRadius: 0.2,
        bilateral: true,
        order: 12,
      },
      amygdala: {
        name: 'Amygdala',
        latin: 'Corpus amygdaloideum',
        desc: 'Almond-shaped nuclei in the medial temporal pole, anterior to the hippocampus. Central to fear conditioning, threat detection, and emotional salience. Part of the limbic system.',
        color: new THREE.Color(0xff6b81),
        dir: new THREE.Vector3(0.6, -0.28, 0.4).normalize(),
        angularRadius: 0.17,
        bilateral: true,
        order: 13,
      },
      // ---------------- HINDBRAIN ----------------
      cerebellum: {
        name: 'Cerebellum',
        latin: 'Cerebellum',
        desc: 'Folded "little brain" in the posterior cranial fossa, inferior to the occipital lobe. Contains more neurons than the cerebrum. Coordinates movement, maintains balance and posture, and participates in motor learning.',
        color: new THREE.Color(0xff5a8a),
        dir: new THREE.Vector3(0.05, -0.62, -0.78).normalize(),
        angularRadius: 0.42,
        bilateral: false,
        order: 14,
      },
      brainstem: {
        name: 'Brainstem',
        latin: 'Truncus encephali',
        desc: 'Comprises midbrain, pons, and medulla oblongata. Controls vital autonomic functions — breathing, heart rate, blood pressure, sleep-wake cycle. All ascending/descending tracts and 10 of 12 cranial nerves pass through.',
        color: new THREE.Color(0x8aff4a),
        dir: new THREE.Vector3(0, -0.95, -0.2).normalize(),
        angularRadius: 0.3,
        bilateral: false,
        order: 15,
      },
      // ---------------- SENSORY ----------------
      olfactoryBulb: {
        name: 'Olfactory Bulb',
        latin: 'Bulbus olfactorius',
        desc: 'Small, paired, bulbous structure on the orbital surface of the frontal lobe. First relay for olfactory receptor neurons — the only sensory pathway that bypasses the thalamus. Projects directly to the olfactory cortex.',
        color: new THREE.Color(0xffd93d),
        dir: new THREE.Vector3(0.16, -0.28, 0.94).normalize(),
        angularRadius: 0.14,
        bilateral: true,
        order: 16,
      },
    };

    const REGION_KEYS = Object.keys(REGIONS);
    const REGION_INDEX = {};
    REGION_KEYS.forEach((k, i) => REGION_INDEX[k] = i);

    // ----- DOM -----
    const container = document.getElementById('canvas-container');
    const loader = document.getElementById('loader');
    const infoOverlay = document.getElementById('infoOverlay');
    const regionName = document.getElementById('regionName');
    const regionLatin = document.getElementById('regionLatin');
    const regionDesc = document.getElementById('regionDesc');
    const closeBtn = document.getElementById('closeBtn');

    // ----- SCENE / CAMERA / RENDERER -----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040607);
    scene.fog = new THREE.FogExp2(0x040607, 0.03);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.45, 2.0, 5.3);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // ----- CONTROLS -----
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.enablePan = false;
    controls.minDistance = 4.5;
    controls.maxDistance = 12.0;
    controls.minPolarAngle = Math.PI / 4;
    controls.maxPolarAngle = Math.PI / 1.7;
    controls.target.set(0, 0, 0);

    // ----- SMOOTH DAMPED ZOOM -----
    // The stock OrbitControls dolly snaps to a new distance on every wheel
    // event, which reads as "too close / too far". We drive a target
    // distance instead, and ease the camera toward it each frame.
    const MIN_DISTANCE = 4.5;
    const MAX_DISTANCE = 12.0;

    controls.enableZoom = false;

    let targetDistance = camera.position.distanceTo(controls.target);
    const clampDistance = (d) => THREE.MathUtils.clamp(d, MIN_DISTANCE, MAX_DISTANCE);

    renderer.domElement.addEventListener('wheel', (event) => {
      event.preventDefault();

      let delta = event.deltaY;
      if (event.deltaMode === 1) delta *= 16;        // lines  -> px
      else if (event.deltaMode === 2) delta *= 100;  // pages  -> px

      targetDistance = clampDistance(targetDistance * Math.exp(delta * 0.0009));
    }, { passive: false });

    // two-finger pinch (touch) — feeds the same damped target
    let pinchStartSpan = 0;
    let pinchStartTarget = 0;
    const touchSpan = (touches) => Math.hypot(
      touches[0].clientX - touches[1].clientX,
      touches[0].clientY - touches[1].clientY
    );

    renderer.domElement.addEventListener('touchstart', (event) => {
      if (event.touches.length === 2) {
        pinchStartSpan = touchSpan(event.touches);
        pinchStartTarget = targetDistance;
      }
    }, { passive: true });

    renderer.domElement.addEventListener('touchmove', (event) => {
      if (event.touches.length === 2 && pinchStartSpan > 0) {
        targetDistance = clampDistance(pinchStartTarget * (pinchStartSpan / touchSpan(event.touches)));
      }
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', (event) => {
      if (event.touches.length < 2) pinchStartSpan = 0;
    }, { passive: true });

    // ----- LIGHTING -----
    scene.add(new THREE.AmbientLight(0x3a4258, 0.9));

    const keyLight = new THREE.DirectionalLight(0xfff0e6, 2.4);
    keyLight.position.set(4, 6, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.camera.left = -3;
    keyLight.shadow.camera.right = 3;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8ab4ff, 0.7);
    fillLight.position.set(-4, 0.5, 3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x4ae3c0, 1.1);
    rimLight.position.set(-1, -2, -4);
    scene.add(rimLight);

    const topLight = new THREE.DirectionalLight(0xffc0d0, 0.5);
    topLight.position.set(0, 5, -1);
    scene.add(topLight);

    // ----- BRAIN GROUP -----
    const brainGroup = new THREE.Group();
    scene.add(brainGroup);

    // ============================================================
    //  SHARED UNIFORMS FOR THE HIGHLIGHT SHADER
    // ============================================================
    const uActiveFlag      = { value: 0 };
    const uActiveDir       = { value: new THREE.Vector3(0, 0, 1) };
    const uActiveRadius    = { value: 0.5 };
    const uActiveBilateral = { value: 0 };
    const uRegionColor     = { value: new THREE.Color(0xffffff) };
    const uPulse           = { value: 0 };

    // ============================================================
    //  BRAIN MODEL LOADING
    // ============================================================
    const gltfLoader = new GLTFLoader();
    const MODEL_URL = 'https://raw.githubusercontent.com/CRYPTOcoderAS/AR-Based-Laboratory/main/Lab%20Models/Brain.glb';

    let brainMesh = null;

    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        const model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.4 / maxDim;

        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));
        model.rotation.y = Math.PI;

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(mat => {
              if (mat) {
                mat.roughness = Math.min(mat.roughness ?? 0.7, 0.75);
                mat.metalness = Math.max(mat.metalness ?? 0.0, 0.02);
                mat.envMapIntensity = 0.6;
              }
            });
            if (!brainMesh) brainMesh = child;
          }
        });

        brainGroup.add(model);

        requestAnimationFrame(() => {
          applyHighlightShader();
          setTimeout(() => loader.classList.add('hidden'), 250);
        });
      },
      undefined,
      (error) => {
        console.warn('GLB model failed to load:', error);
        createFallbackSphere();
        requestAnimationFrame(() => {
          applyHighlightShader();
          loader.classList.add('hidden');
        });
      }
    );

    function createFallbackSphere() {
      const geo = new THREE.SphereGeometry(1.2, 64, 64);
      const mat = new THREE.MeshPhysicalMaterial({
        color: 0xd4b2a2,
        roughness: 0.7,
        metalness: 0.02,
        clearcoat: 0.2,
        sheen: 0.3,
        sheenColor: new THREE.Color(0xff9a88),
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      brainGroup.add(mesh);
      brainMesh = mesh;
    }

    // ============================================================
    //  HIGHLIGHT SHADER PATCH
    // ============================================================
    function applyHighlightShader() {
      if (!brainMesh) return;

      brainGroup.updateMatrixWorld(true);
      brainMesh.updateMatrixWorld(true);

      const mat = brainMesh.material;
      const mats = Array.isArray(mat) ? mat : [mat];

      mats.forEach(m => {
        if (!m) return;

        m.onBeforeCompile = (shader) => {
          shader.uniforms.uActiveFlag      = uActiveFlag;
          shader.uniforms.uActiveDir       = uActiveDir;
          shader.uniforms.uActiveRadius    = uActiveRadius;
          shader.uniforms.uActiveBilateral = uActiveBilateral;
          shader.uniforms.uRegionColor     = uRegionColor;
          shader.uniforms.uPulse           = uPulse;

          shader.vertexShader = shader.vertexShader.replace(
            '#include <common>',
            `
            #include <common>
            varying vec3 vLocalPos;
            `
          );

          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `
            #include <begin_vertex>
            vLocalPos = position;
            `
          );

          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <common>',
            `
            #include <common>
            varying vec3 vLocalPos;
            uniform float uActiveFlag;
            uniform vec3 uActiveDir;
            uniform float uActiveRadius;
            uniform float uActiveBilateral;
            uniform vec3 uRegionColor;
            uniform float uPulse;
            `
          );

          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <dithering_fragment>',
            `
            if (uActiveFlag > 0.5) {
              vec3 dir = normalize(vLocalPos);
              float angle = acos(clamp(dot(dir, uActiveDir), -1.0, 1.0));

              if (uActiveBilateral > 0.5) {
                vec3 mirrorDir = vec3(-uActiveDir.x, uActiveDir.y, uActiveDir.z);
                float angle2 = acos(clamp(dot(dir, mirrorDir), -1.0, 1.0));
                angle = min(angle, angle2);
              }

              float mask = 1.0 - smoothstep(uActiveRadius * 0.88, uActiveRadius * 1.06, angle);

              if (mask > 0.001) {
                float pulse = 0.72 + 0.28 * sin(uPulse * 3.0);
                gl_FragColor.rgb = mix(gl_FragColor.rgb, uRegionColor, 0.68 * mask * pulse);
                gl_FragColor.rgb += uRegionColor * 0.42 * mask * pulse;
              }
            }

            #include <dithering_fragment>
            `
          );

          m.userData.shader = shader;
        };

        m.needsUpdate = true;
      });
    }

    // ============================================================
    //  RAYCASTER
    // ============================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('pointermove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      if (brainMesh) {
        const hits = raycaster.intersectObject(brainMesh, true);
        if (hits.length > 0) {
          const key = findRegionAt(hits[0].point);
          document.body.style.cursor = key ? 'pointer' : 'grab';
        } else {
          document.body.style.cursor = 'grab';
        }
      }
    });

    renderer.domElement.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      if (brainMesh) {
        const hits = raycaster.intersectObject(brainMesh, true);
        if (hits.length > 0) {
          const key = findRegionAt(hits[0].point);
          if (key) showRegionInfo(key);
        }
      }
    });

    /**
     * Find region at a world-space point. Uses a priority system
     * based on order (smaller/deeper structures win) so that
     * structures like the amygdala and hippocampus remain
     * clickable even where they lie under a larger cortical lobe.
     */
    function findRegionAt(worldPoint) {
      if (!brainMesh) return null;

      const localPoint = worldPoint.clone();
      brainMesh.worldToLocal(localPoint);
      const dir = localPoint.clone().normalize();

      let bestKey = null;
      let bestScore = Infinity;

      REGION_KEYS.forEach(key => {
        const region = REGIONS[key];

        let angle = Math.acos(THREE.MathUtils.clamp(dir.dot(region.dir), -1, 1));

        if (region.bilateral) {
          const mirror = new THREE.Vector3(-region.dir.x, region.dir.y, region.dir.z);
          const a2 = Math.acos(THREE.MathUtils.clamp(dir.dot(mirror), -1, 1));
          angle = Math.min(angle, a2);
        }

        if (angle < region.angularRadius * 1.08) {
          // Score = normalized angle, with an order-based tie-breaker
          // so smaller / more specific structures win over large lobes.
          const score = angle / region.angularRadius + (region.order || 0) * 0.001;
          if (score < bestScore) {
            bestScore = score;
            bestKey = key;
          }
        }
      });

      return bestKey;
    }

    // ============================================================
    //  INFO PANEL
    // ============================================================
    function showRegionInfo(key) {
      const region = REGIONS[key];
      if (!region) return;

      regionName.textContent = region.name;
      regionLatin.textContent = region.latin;
      regionDesc.textContent = region.desc;
      infoOverlay.classList.add('visible');
      controls.autoRotate = false;

      uActiveFlag.value = 1;
      uActiveDir.value.copy(region.dir);
      uActiveRadius.value = region.angularRadius;
      uActiveBilateral.value = region.bilateral ? 1 : 0;
      uRegionColor.value.copy(region.color);
    }

    function hideRegionInfo() {
      infoOverlay.classList.remove('visible');
      controls.autoRotate = true;
      uActiveFlag.value = 0;
    }
    closeBtn.addEventListener('click', hideRegionInfo);

    // ============================================================
    //  ANIMATION LOOP
    // ============================================================
    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.1);
      const t = clock.elapsedTime;
      brainGroup.rotation.y = Math.sin(t * 0.08) * 0.03;
      uPulse.value = t;

      controls.update();

      // ease the camera toward the requested zoom distance
      const currentDistance = camera.position.distanceTo(controls.target);
      const nextDistance = THREE.MathUtils.damp(currentDistance, targetDistance, 10, dt);

      camera.position
        .sub(controls.target)
        .setLength(nextDistance)
        .add(controls.target);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
