<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tip Calculator — Split the Bill Fast</title>
<meta name="description" content="Free tip calculator. Enter your bill, pick a tip percentage, and split the total between any number of people. Works instantly on mobile." />

<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #334155;
    --accent: #22d3ee;
    --accent-2: #06b6d4;
    --ink: #f1f5f9;
    --muted: #94a3b8;
    --line: #334155;
    --success: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0f172a 60%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    border: 1px solid var(--line);
  }

  /* ---------- Header ---------- */
  .header {
    padding: 22px 24px 16px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .header h1 span { color: var(--accent); }
  .header p {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ---------- Body ---------- */
  .body { padding: 22px 24px 24px; }

  .field { margin-bottom: 20px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .bill-input {
    position: relative;
  }
  .bill-input .prefix {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 26px;
    font-weight: 700;
    color: var(--muted);
    pointer-events: none;
  }
  .bill-input input {
    width: 100%;
    padding: 16px 16px 16px 40px;
    background: var(--card-2);
    border: 2px solid transparent;
    border-radius: 12px;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .bill-input input:focus { border-color: var(--accent); }

  /* ---------- Tip buttons ---------- */
  .tip-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .tip-btn {
    padding: 12px 0;
    border-radius: 10px;
    background: var(--card-2);
    border: 2px solid transparent;
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.12s;
  }
  .tip-btn:hover { background: #475569; }
  .tip-btn.active {
    background: var(--accent);
    color: #0f172a;
    border-color: var(--accent);
  }

  .custom-tip {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .custom-tip input {
    flex: 1;
    padding: 11px 14px;
    background: var(--card-2);
    border: 2px solid transparent;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    font-family: inherit;
    outline: none;
  }
  .custom-tip input:focus { border-color: var(--accent); }
  .custom-tip span {
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
  }

  /* ---------- Split people ---------- */
  .split-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .round-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--card-2);
    border: none;
    color: var(--accent);
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .round-btn:hover { background: #475569; }
  .round-btn:active { transform: scale(0.94); }

  .people-count {
    flex: 1;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--ink);
  }
  .people-count small {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  /* ---------- Results ---------- */
  .results {
    margin-top: 24px;
    padding-top: 22px;
    border-top: 2px dashed var(--line);
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    font-size: 15px;
  }
  .result-row .label { color: var(--muted); font-weight: 500; }
  .result-row .value { font-weight: 700; color: var(--ink); }

  .result-row.total {
    margin-top: 10px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .result-row.total .label {
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
  }
  .result-row.total .value {
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .per-person {
    margin-top: 14px;
    background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(6, 182, 212, 0.25);
  }
  .per-person .label {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .per-person .value {
    font-size: 38px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.03em;
    margin-top: 4px;
  }
  .per-person .sub {
    font-size: 12.5px;
    color: rgba(255,255,255,0.85);
    margin-top: 4px;
    font-weight: 500;
  }

  /* ---------- Reset ---------- */
  .reset-btn {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.12s;
  }
  .reset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---------- Footer ---------- */
  .footer {
    padding: 16px 24px 22px;
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  /* Remove number spinners */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <h1>Tip<span>Calc</span></h1>
    <p>Split the bill in seconds</p>
  </div>

  <div class="body">

    <!-- Bill amount -->
    <div class="field">
      <label for="bill">Bill Amount</label>
      <div class="bill-input">
        <span class="prefix">$</span>
        <input type="number" id="bill" placeholder="0.00" inputmode="decimal" min="0" step="0.01" />
      </div>
    </div>

    <!-- Tip % -->
    <div class="field">
      <label>Tip Percentage</label>
      <div class="tip-grid" id="tipGrid">
        <button type="button" class="tip-btn" data-tip="10">10%</button>
        <button type="button" class="tip-btn" data-tip="15">15%</button>
        <button type="button" class="tip-btn active" data-tip="18">18%</button>
        <button type="button" class="tip-btn" data-tip="20">20%</button>
        <button type="button" class="tip-btn" data-tip="25">25%</button>
      </div>
      <div class="custom-tip">
        <input type="number" id="customTip" placeholder="Custom tip" inputmode="decimal" min="0" step="0.5" />
        <span>%</span>
      </div>
    </div>

    <!-- Split -->
    <div class="field">
      <label>Split Between</label>
      <div class="split-row">
        <button type="button" class="round-btn" id="minusBtn">−</button>
        <div class="people-count">
          <span id="peopleCount">1</span>
          <small id="peopleLabel">person</small>
        </div>
        <button type="button" class="round-btn" id="plusBtn">+</button>
      </div>
    </div>

    <!-- Results -->
    <div class="results">
      <div class="result-row">
        <span class="label">Bill</span>
        <span class="value" id="resBill">$0.00</span>
      </div>
      <div class="result-row">
        <span class="label">Tip</span>
        <span class="value" id="resTip">$0.00</span>
      </div>
      <div class="result-row total">
        <span class="label">Total</span>
        <span class="value" id="resTotal">$0.00</span>
      </div>

      <div class="per-person" id="perPersonBox" style="display:none;">
        <div class="label">Each Person Pays</div>
        <div class="value" id="resPerPerson">$0.00</div>
        <div class="sub" id="perPersonSub"></div>
      </div>
    </div>

    <button type="button" class="reset-btn" id="resetBtn">Reset</button>

  </div>

  <div class="footer">
    No sign-up · No tracking · Works offline
  </div>

</div>

<script>
(function () {
  // ---------- State ----------
  let tipPercent = 18;
  let people = 1;

  // ---------- Elements ----------
  const billInput   = document.getElementById('bill');
  const customTip   = document.getElementById('customTip');
  const tipButtons  = document.querySelectorAll('.tip-btn');
  const peopleCount = document.getElementById('peopleCount');
  const peopleLabel = document.getElementById('peopleLabel');
  const minusBtn    = document.getElementById('minusBtn');
  const plusBtn     = document.getElementById('plusBtn');
  const resetBtn    = document.getElementById('resetBtn');

  const resBill       = document.getElementById('resBill');
  const resTip        = document.getElementById('resTip');
  const resTotal      = document.getElementById('resTotal');
  const resPerPerson  = document.getElementById('resPerPerson');
  const perPersonBox  = document.getElementById('perPersonBox');
  const perPersonSub  = document.getElementById('perPersonSub');

  // ---------- Helpers ----------
  const fmt = (n) => '$' + (isFinite(n) ? n.toFixed(2) : '0.00');

  // ---------- Render ----------
  function calculate() {
    const bill = parseFloat(billInput.value) || 0;
    const tipAmount = bill * (tipPercent / 100);
    const total = bill + tipAmount;
    const perPerson = people > 0 ? total / people : total;

    resBill.textContent  = fmt(bill);
    resTip.textContent   = fmt(tipAmount);
    resTotal.textContent = fmt(total);

    if (people > 1) {
      perPersonBox.style.display = 'block';
      resPerPerson.textContent = fmt(perPerson);
      perPersonSub.textContent =
        `${people} people × ${fmt(perPerson)}  ·  includes ${fmt(tipAmount / people)} tip each`;
    } else {
      perPersonBox.style.display = 'none';
    }
  }

  // ---------- Tip selection ----------
  tipButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tipButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tipPercent = parseFloat(btn.dataset.tip);
      customTip.value = '';
      calculate();
    });
  });

  customTip.addEventListener('input', () => {
    const v = parseFloat(customTip.value);
    if (!isNaN(v) && v >= 0) {
      tipPercent = v;
      tipButtons.forEach(b => b.classList.remove('active'));
      calculate();
    } else if (customTip.value === '') {
      tipPercent = 18;
      document.querySelector('.tip-btn[data-tip="18"]').classList.add('active');
      calculate();
    }
  });

  // ---------- Bill input ----------
  billInput.addEventListener('input', calculate);

  // ---------- Split buttons ----------
  function updatePeople() {
    peopleCount.textContent = people;
    peopleLabel.textContent = people === 1 ? 'person' : 'people';
    minusBtn.disabled = people <= 1;
    minusBtn.style.opacity = people <= 1 ? 0.4 : 1;
    calculate();
  }

  minusBtn.addEventListener('click', () => {
    if (people > 1) { people--; updatePeople(); }
  });

  plusBtn.addEventListener('click', () => {
    if (people < 99) { people++; updatePeople(); }
  });

  // ---------- Reset ----------
  resetBtn.addEventListener('click', () => {
    billInput.value = '';
    customTip.value = '';
    tipPercent = 18;
    people = 1;
    tipButtons.forEach(b => b.classList.remove('active'));
    document.querySelector('.tip-btn[data-tip="18"]').classList.add('active');
    updatePeople();
    calculate();
    billInput.focus();
  });

  // ---------- Init ----------
  updatePeople();
  calculate();
})();
</script>

</body>
</html>
