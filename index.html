<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAIN · 3D atlas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #040607;
      --text: #f0f4f8;
      --dim: #5a6b7c;
      --accent: #4ae3c0;
    }
    body {
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }

    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      pointer-events: none;
    }
    .brand {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      pointer-events: auto;
    }
    .brand .dot {
      width: 5px; height: 5px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2.4s infinite ease-in-out;
    }
    .hint {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
      pointer-events: auto;
    }

    .info-overlay {
      position: fixed;
      bottom: 2rem; left: 2rem;
      z-index: 10;
      max-width: 340px;
      pointer-events: none;
    }
    .info-card {
      background: rgba(5, 8, 12, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 1rem;
      padding: 1.4rem 1.6rem;
      pointer-events: auto;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s, transform 0.35s;
      box-shadow: 0 20px 40px -20px #000;
      position: relative;
    }
    .info-overlay.visible .info-card {
      opacity: 1;
      transform: translateY(0);
    }
    .region-name {
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 0.15rem;
    }
    .region-latin {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--accent);
      margin-bottom: 0.9rem;
      font-weight: 400;
    }
    .region-desc {
      font-size: 0.82rem;
      color: #a0b4c8;
      line-height: 1.65;
      margin-bottom: 1rem;
    }
    .region-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--dim);
      padding-top: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .region-meta .dot {
      width: 4px; height: 4px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }
    .close-btn {
      position: absolute;
      top: 0.8rem; right: 0.8rem;
      width: 24px; height: 24px;
      border: none;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
      font-size: 0.85rem;
      line-height: 1;
      pointer-events: auto;
    }
    .close-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: opacity 0.6s;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }
    .loader .ring {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loader .load-text {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--dim);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }

    @media (max-width: 700px) {
      .top-bar { padding: 1rem 1.2rem; }
      .info-overlay { bottom: 1rem; left: 1rem; right: 1rem; max-width: none; }
      .info-card { padding: 1.2rem; }
      .region-name { font-size: 1.1rem; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="ring"></div>
    <div class="load-text">loading anatomy</div>
  </div>

  <div id="canvas-container"></div>

  <div class="top-bar">
    <div class="brand">
      <span class="dot"></span>
      Brain · 3D Atlas
    </div>
    <div class="hint">drag to rotate · click a region</div>
  </div>

  <div class="info-overlay" id="infoOverlay">
    <div class="info-card" id="infoCard">
      <button class="close-btn" id="closeBtn" aria-label="close">✕</button>
      <div class="region-name" id="regionName">—</div>
      <div class="region-latin" id="regionLatin">—</div>
      <div class="region-desc" id="regionDesc">—</div>
      <div class="region-meta">
        <span class="dot"></span>
        <span>cortical region</span>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ============================================================
    //  REGION DEFINITIONS
    //  Each region is defined by a normalized anatomical "center"
    //  in the brain's local coordinate space (roughly a unit sphere
    //  after normalization), plus an angular radius that defines
    //  the extent of the region on the brain surface.
    //  The brain model faces +Z (front) and +Y (up).
    // ============================================================
    const REGIONS = {
      frontal: {
        name: 'Frontal Lobe',
        latin: 'Lobus frontalis',
        desc: 'Executive functions, decision-making, voluntary movement, speech production (Broca\'s area), and personality.',
        color: new THREE.Color(0x4a9eff),
        // Direction on the surface (normalized). Front-upper area.
        dir: new THREE.Vector3(0.0, 0.15, 1.0).normalize(),
        // Angular extent in radians
        angularRadius: 1.05,
      },
      parietal: {
        name: 'Parietal Lobe',
        latin: 'Lobus parietalis',
        desc: 'Somatosensory processing, spatial awareness, navigation, and integration of sensory information.',
        color: new THREE.Color(0x4ae3c0),
        // Top-back area
        dir: new THREE.Vector3(0.0, 1.0, -0.25).normalize(),
        angularRadius: 0.95,
      },
      temporal: {
        name: 'Temporal Lobe',
        latin: 'Lobus temporalis',
        desc: 'Auditory processing, memory formation (hippocampus), language comprehension, and emotional association.',
        color: new THREE.Color(0xffa64a),
        // Side-lower area (only right side visible by default)
        dir: new THREE.Vector3(1.0, -0.25, 0.1).normalize(),
        angularRadius: 0.85,
      },
      occipital: {
        name: 'Occipital Lobe',
        latin: 'Lobus occipitalis',
        desc: 'Primary visual cortex (V1) and visual association areas. Processes shape, color, motion, and visual recognition.',
        color: new THREE.Color(0xa45aff),
        // Back-lower-upper area
        dir: new THREE.Vector3(0.0, 0.35, -1.0).normalize(),
        angularRadius: 0.85,
      },
      cerebellum: {
        name: 'Cerebellum',
        latin: 'Cerebellum',
        desc: 'Motor coordination, balance, posture, and motor learning. Fine-tunes movements and maintains equilibrium.',
        color: new THREE.Color(0xff5a8a),
        // Lower-back, specifically below occipital
        dir: new THREE.Vector3(0.0, -0.75, -0.85).normalize(),
        angularRadius: 0.65,
      },
      brainstem: {
        name: 'Brainstem',
        latin: 'Truncus encephali',
        desc: 'Midbrain, pons, medulla. Vital autonomic functions: breathing, heart rate, sleep-wake cycle, cranial nerve relay.',
        color: new THREE.Color(0x8aff4a),
        // Bottom center, descending
        dir: new THREE.Vector3(0.0, -1.0, -0.15).normalize(),
        angularRadius: 0.5,
      }
    };

    const REGION_KEYS = Object.keys(REGIONS);
    const REGION_INDEX = {};
    REGION_KEYS.forEach((k, i) => REGION_INDEX[k] = i);

    // ----- DOM -----
    const container = document.getElementById('canvas-container');
    const loader = document.getElementById('loader');
    const infoOverlay = document.getElementById('infoOverlay');
    const regionName = document.getElementById('regionName');
    const regionLatin = document.getElementById('regionLatin');
    const regionDesc = document.getElementById('regionDesc');
    const closeBtn = document.getElementById('closeBtn');

    // ----- SCENE / CAMERA / RENDERER -----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040607);
    scene.fog = new THREE.FogExp2(0x040607, 0.03);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5.5, 2.5, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // ----- CONTROLS -----
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.enablePan = false;
    controls.minDistance = 4.5;
    controls.maxDistance = 12.0;
    controls.minPolarAngle = Math.PI / 4;
    controls.maxPolarAngle = Math.PI / 1.7;
    controls.target.set(0, 0, 0);

    // ----- LIGHTING -----
    scene.add(new THREE.AmbientLight(0x3a4258, 0.9));

    const keyLight = new THREE.DirectionalLight(0xfff0e6, 2.4);
    keyLight.position.set(4, 6, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.camera.left = -3;
    keyLight.shadow.camera.right = 3;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8ab4ff, 0.7);
    fillLight.position.set(-4, 0.5, 3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x4ae3c0, 1.1);
    rimLight.position.set(-1, -2, -4);
    scene.add(rimLight);

    const topLight = new THREE.DirectionalLight(0xffc0d0, 0.5);
    topLight.position.set(0, 5, -1);
    scene.add(topLight);

    // ----- BRAIN GROUP -----
    const brainGroup = new THREE.Group();
    scene.add(brainGroup);

    // ============================================================
    //  SHARED UNIFORMS FOR THE HIGHLIGHT SHADER
    // ============================================================
    const uActiveIndex = { value: -1 };
    const uRegionColor = { value: new THREE.Color(0xffffff) };
    const uPulse = { value: 0 };
    // Six region directions (normalized) and angular radii, padded
    const uRegionDirs = { value: REGION_KEYS.map(k => REGIONS[k].dir.clone()) };
    const uRegionRadii = { value: REGION_KEYS.map(k => REGIONS[k].angularRadius) };

    // ============================================================
    //  BRAIN MODEL LOADING
    // ============================================================
    const gltfLoader = new GLTFLoader();
    const MODEL_URL = 'https://raw.githubusercontent.com/CRYPTOcoderAS/AR-Based-Laboratory/main/Lab%20Models/Brain.glb';

    let brainMesh = null;

    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        const model = gltf.scene;

        // Normalize: center at origin, scale to fit ~2.4 units
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.4 / maxDim;

        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));

        // Orient the model so that +Z = front, +Y = up.
        // The Brain.glb from that repo is typically oriented with
        // -Z as front. We flip it here so anatomical mapping works.
        // We rotate 180° around Y to face the camera naturally.
        model.rotation.y = Math.PI;

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;

            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(mat => {
              if (mat) {
                mat.roughness = Math.min(mat.roughness ?? 0.7, 0.75);
                mat.metalness = Math.max(mat.metalness ?? 0.0, 0.02);
                mat.envMapIntensity = 0.6;
              }
            });

            if (!brainMesh) brainMesh = child;
          }
        });

        brainGroup.add(model);

        // Wait one frame so matrixWorld is updated
        requestAnimationFrame(() => {
          applyHighlightShader();
          setTimeout(() => loader.classList.add('hidden'), 250);
        });
      },
      undefined,
      (error) => {
        console.warn('GLB model failed to load:', error);
        createFallbackSphere();
        requestAnimationFrame(() => {
          applyHighlightShader();
          loader.classList.add('hidden');
        });
      }
    );

    function createFallbackSphere() {
      const geo = new THREE.SphereGeometry(1.2, 64, 64);
      const mat = new THREE.MeshPhysicalMaterial({
        color: 0xd4b2a2,
        roughness: 0.7,
        metalness: 0.02,
        clearcoat: 0.2,
        sheen: 0.3,
        sheenColor: new THREE.Color(0xff9a88),
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      brainGroup.add(mesh);
      brainMesh = mesh;
    }

    // ============================================================
    //  HIGHLIGHT SHADER PATCH
    //  The fragment shader receives a per-fragment direction in
    //  LOCAL brain space. For each of the 6 regions, we compute
    //  the angular distance from the fragment's direction to that
    //  region's anatomical direction. If within the region's radius,
    //  we tint the fragment with the region color.
    //  The highlight is computed purely from direction, so it wraps
    //  around the entire lobe area smoothly — no floating overlay.
    // ============================================================
    function applyHighlightShader() {
      if (!brainMesh) return;

      // Make sure world matrices are current
      brainGroup.updateMatrixWorld(true);
      brainMesh.updateMatrixWorld(true);

      const mat = brainMesh.material;
      const mats = Array.isArray(mat) ? mat : [mat];

      mats.forEach(m => {
        if (!m) return;

        m.onBeforeCompile = (shader) => {
          // Share the uniforms
          shader.uniforms.uActiveIndex = uActiveIndex;
          shader.uniforms.uRegionColor = uRegionColor;
          shader.uniforms.uPulse = uPulse;
          shader.uniforms.uRegionDirs = uRegionDirs;
          shader.uniforms.uRegionRadii = uRegionRadii;

          // Pass local position to the fragment shader
          shader.vertexShader = shader.vertexShader.replace(
            '#include <common>',
            `
            #include <common>
            varying vec3 vLocalPos;
            `
          );

          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `
            #include <begin_vertex>
            vLocalPos = position;
            `
          );

          // Fragment shader: tint the surface based on direction
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <common>',
            `
            #include <common>
            varying vec3 vLocalPos;
            uniform float uActiveIndex;
            uniform vec3 uRegionColor;
            uniform float uPulse;
            uniform vec3 uRegionDirs[6];
            uniform float uRegionRadii[6];
            `
          );

          // We inject the highlight right before the final output
          // is assembled. Using dithering_fragment as a hook is
          // safe because it runs after all lighting is applied.
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <dithering_fragment>',
            `
            // Compute the surface direction in LOCAL brain space.
            // Normalize so all directions are unit vectors.
            if (uActiveIndex >= 0.0) {
              vec3 dir = normalize(vLocalPos);

              // Get the active region's anatomical direction
              int idx = int(uActiveIndex + 0.5);
              vec3 regionDir = uRegionDirs[idx];
              float regionRadius = uRegionRadii[idx];

              // Angular distance
              float cosAngle = clamp(dot(dir, regionDir), -1.0, 1.0);
              float angle = acos(cosAngle);

              // Soft edge falloff: 1 inside, 0 outside
              float mask = 1.0 - smoothstep(regionRadius * 0.85, regionRadius * 1.05, angle);

              if (mask > 0.001) {
                // Pulse the glow
                float pulse = 0.7 + 0.3 * sin(uPulse * 3.0);

                // Mix the surface color with the region color,
                // and add an emissive boost so the region "glows"
                gl_FragColor.rgb = mix(gl_FragColor.rgb, uRegionColor, 0.65 * mask * pulse);
                gl_FragColor.rgb += uRegionColor * 0.4 * mask * pulse;
              }
            }

            #include <dithering_fragment>
            `
          );

          m.userData.shader = shader;
        };

        m.needsUpdate = true;
      });
    }

    // ============================================================
    //  RAYCASTER — click detection on the brain surface
    // ============================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('pointermove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      if (brainMesh) {
        const hits = raycaster.intersectObject(brainMesh, true);
        if (hits.length > 0) {
          const key = findRegionAt(hits[0].point);
          document.body.style.cursor = key ? 'pointer' : 'grab';
        } else {
          document.body.style.cursor = 'grab';
        }
      }
    });

    renderer.domElement.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      if (brainMesh) {
        const hits = raycaster.intersectObject(brainMesh, true);
        if (hits.length > 0) {
          const key = findRegionAt(hits[0].point);
          if (key) showRegionInfo(key);
        }
      }
    });

    /**
     * Given a world-space point on the brain, determine which
     * region it falls into. We convert the point to LOCAL brain
     * space and then use direction + angular radius to classify.
     */
    function findRegionAt(worldPoint) {
      if (!brainMesh) return null;

      // Convert world point → local brain space
      const localPoint = worldPoint.clone();
      brainMesh.worldToLocal(localPoint);

      // Normalize to get a unit direction
      const dir = localPoint.clone().normalize();

      let bestKey = null;
      let bestAngle = Infinity;

      REGION_KEYS.forEach(key => {
        const region = REGIONS[key];
        const cosAngle = THREE.MathUtils.clamp(dir.dot(region.dir), -1, 1);
        const angle = Math.acos(cosAngle);
        if (angle < region.angularRadius * 1.15 && angle < bestAngle) {
          bestAngle = angle;
          bestKey = key;
        }
      });

      return bestKey;
    }

    // ============================================================
    //  INFO PANEL
    // ============================================================
    function showRegionInfo(key) {
      const region = REGIONS[key];
      if (!region) return;

      regionName.textContent = region.name;
      regionLatin.textContent = region.latin;
      regionDesc.textContent = region.desc;
      infoOverlay.classList.add('visible');
      controls.autoRotate = false;

      uActiveIndex.value = REGION_INDEX[key];
      uRegionColor.value.copy(region.color);
    }

    function hideRegionInfo() {
      infoOverlay.classList.remove('visible');
      controls.autoRotate = true;
      uActiveIndex.value = -1;
    }
    closeBtn.addEventListener('click', hideRegionInfo);

    // ============================================================
    //  ANIMATION LOOP
    // ============================================================
    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();
      brainGroup.rotation.y = Math.sin(t * 0.08) * 0.03;
      uPulse.value = t;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
